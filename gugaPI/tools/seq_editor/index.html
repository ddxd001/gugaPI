<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>gugaPI Control Center</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;background:#1e1e2e;color:#cdd6f4;display:flex;flex-direction:column;height:100vh}
header{background:#313244;padding:10px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;flex:1}
button{background:#45475a;color:#cdd6f4;border:1px solid #585b70;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
button:hover{background:#585b70}
button:disabled{opacity:0.4;cursor:not-allowed}
button.primary{background:#89b4fa;color:#1e1e2e;border:none;font-weight:600}
button.danger{background:#f38ba8;color:#1e1e2e;border:none}
.tabbar{display:flex;background:#181825;padding:0 8px}
.tab{padding:8px 20px;cursor:pointer;border:none;background:none;color:#6c7086;font-size:14px;border-bottom:2px solid transparent;border-radius:0}
.tab:hover{background:#252536;color:#cdd6f4}
.tab.active{color:#cdd6f4;border-bottom-color:#89b4fa}
.main{display:flex;flex:1;overflow:hidden}
.main[hidden]{display:none}
.sidebar{width:180px;background:#313244;padding:8px;overflow-y:auto}
.slot-card{background:#45475a;border-radius:6px;padding:8px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between}
.slot-card:hover{background:#585b70}
.slot-card.active{border:2px solid #89b4fa}
.canvas-area{flex:1;overflow:hidden;position:relative;background:#181825;cursor:grab}
.canvas-area:active{cursor:grabbing}
.canvas-area svg{position:absolute;top:0;left:0;width:100%;height:100%}
.editor{width:280px;background:#313244;padding:12px;overflow-y:auto}
.editor label{display:block;font-size:12px;margin-top:8px;margin-bottom:3px;opacity:0.8}
.editor select,.editor input{width:100%;padding:5px;background:#45475a;border:1px solid #585b70;border-radius:4px;color:#cdd6f4}
.btn-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn-row button{flex:1;min-width:60px;font-size:12px;padding:5px}
.log{height:100px;background:#181825;padding:6px 10px;overflow-y:auto;font-family:monospace;font-size:11px}
.log[hidden]{display:none}
.log .tx{color:#a6e3a1}.log .rx{color:#89b4fa}
.arrow-label{font-size:10px;font-weight:600}
#termView{background:#181825}
#termPanel{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#termToolbar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#313244;border-bottom:1px solid #45475a}
#termToolbar .term-info{flex:1;color:#9399b2;font-size:12px}
#termToolbar button{padding:4px 10px;font-size:12px}
#termDisplay{flex:1;overflow:auto;padding:10px 12px;font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}
#termDisplay .tx{color:#a6e3a1}
#termDisplay .rx{color:#89b4fa}
#termDisplay .hint{color:#9399b2}
#termDisplay .error{color:#f38ba8}
#termInputRow{display:flex;padding:8px 12px;background:#313244;align-items:center;gap:8px}
#termInputRow .prompt{color:#a6e3a1;font-family:monospace;font-size:14px}
#termInput{flex:1;background:#1e1e2e;border:1px solid #585b70;border-radius:4px;padding:7px 10px;color:#cdd6f4;font-family:Consolas,"Cascadia Mono",monospace;font-size:13px}
#termInput:focus{outline:none;border-color:#89b4fa}
#termInput:disabled{opacity:.55;cursor:not-allowed}
#paramView{background:#11131a;color:#e4e8f0}
#paramShell{display:grid;grid-template-rows:auto 1fr;flex:1;min-width:0;overflow:hidden}
#paramToolbar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#20242d;border-bottom:1px solid #343a46;flex-wrap:wrap}
#paramToolbar .param-title{font-size:15px;font-weight:700;margin-right:4px}
#paramToolbar .param-spacer{flex:1}
#paramToolbar input[type=search]{width:min(340px,32vw);background:#151820;border:1px solid #3b4350;border-radius:5px;color:#edf1f7;padding:7px 10px}
#paramToolbar input[type=search]:focus{outline:none;border-color:#4da3d9}
#paramToolbar label{display:flex;align-items:center;gap:5px;color:#aeb7c5;font-size:12px}
#paramToolbar button{background:#2c323d;border-color:#414a58;border-radius:4px}
#paramToolbar button.primary{background:#2d8ac0;color:#fff}
#paramToolbar button.warn{background:#8c6424;color:#fff;border-color:#a8782b}
#paramLayout{display:grid;grid-template-columns:220px minmax(360px,1fr) 360px;min-height:0;overflow:hidden}
.param-pane{min-width:0;min-height:0;overflow:auto;border-right:1px solid #303642;background:#171a22}
.param-pane:last-child{border-right:none;background:#1c2029}
#paramGroups{padding:10px}
.param-group-section{font-size:10px;letter-spacing:.11em;color:#707b8c;padding:12px 9px 5px;text-transform:uppercase}
.param-group{display:flex;width:100%;align-items:center;justify-content:space-between;padding:8px 10px;margin:2px 0;border:0;border-radius:4px;background:transparent;color:#cbd2dd;text-align:left}
.param-group:hover{background:#252b35}
.param-group.active{background:#263c4b;color:#73c7f1;border-left:3px solid #45a8d8;padding-left:7px}
.param-group .count{font-size:11px;color:#788496;background:#20252e;padding:1px 6px;border-radius:9px}
#paramListHeader{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:minmax(180px,1fr) 110px 70px;padding:8px 14px;background:#20242d;border-bottom:1px solid #343a46;color:#8390a2;font-size:11px}
#paramRows{padding-bottom:20px}
.param-row{display:grid;grid-template-columns:minmax(180px,1fr) 110px 70px;width:100%;align-items:center;border:0;border-bottom:1px solid #252a33;border-radius:0;background:#171a22;color:#dce2eb;padding:9px 14px;text-align:left}
.param-row:hover{background:#202630}
.param-row.active{background:#26333e;box-shadow:inset 3px 0 #45a8d8}
.param-row-name{min-width:0}
.param-row-label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.param-row-raw{display:block;color:#748093;font-family:Consolas,monospace;font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.param-row-value{font-family:Consolas,monospace;color:#f0f3f8;text-align:right;padding-right:12px}
.param-row-badges{display:flex;justify-content:flex-end;gap:4px;flex-wrap:wrap}
.param-badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.03em}
.param-badge.modified{background:#59451d;color:#ffd37a}
.param-badge.reboot{background:#493447;color:#e9a7df}
.param-badge.live{background:#233f37;color:#7ed9b4}
#paramEmpty{padding:45px 20px;text-align:center;color:#758094}
#paramDetails{padding:18px}
.param-detail-kicker{font-size:10px;letter-spacing:.12em;color:#6f7d90;text-transform:uppercase}
.param-detail-title{font-size:20px;line-height:1.25;margin:5px 0 3px;color:#f1f4f8}
.param-detail-raw{font-family:Consolas,monospace;color:#57b8e8;font-size:12px;word-break:break-all}
.param-detail-desc{color:#aeb7c5;line-height:1.55;margin:16px 0}
.param-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.param-fact{background:#151820;border:1px solid #2d3440;border-radius:5px;padding:9px}
.param-fact span{display:block;color:#748093;font-size:10px;margin-bottom:4px}
.param-fact strong{font-family:Consolas,monospace;font-size:12px;font-weight:500;color:#e7ebf1;word-break:break-all}
.param-edit-card{margin-top:16px;padding:13px;background:#151820;border:1px solid #343c49;border-radius:6px}
.param-edit-card label.edit-label{display:block;color:#8d99aa;font-size:11px;margin-bottom:6px}
.param-edit-card input[type=number]{width:100%;padding:8px 9px;background:#0f1218;border:1px solid #3b4553;border-radius:4px;color:#f0f3f8;font-family:Consolas,monospace}
.param-edit-card input:focus{outline:none;border-color:#4da3d9}
.param-preview{min-height:18px;margin-top:5px;color:#7e8a9a;font-size:11px}
.param-switch-row{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #292f39}
.param-switch-row:last-child{border-bottom:0}
.param-switch-row input{accent-color:#45a8d8;width:17px;height:17px}
.param-detail-actions{display:flex;gap:7px;margin-top:12px}
.param-detail-actions button{flex:1}
.param-detail-actions button.primary{background:#2d8ac0;color:#fff}
.param-statusbar{display:flex;gap:6px;align-items:center;color:#9aa5b4;font-size:11px}
.param-status-dot{width:8px;height:8px;border-radius:50%;background:#697382}
.param-status-dot.ok{background:#51bd8b}.param-status-dot.warn{background:#e0a64a}.param-status-dot.error{background:#e06767}
#paramNotice{display:none;padding:8px 12px;background:#6e4c1b;color:#ffe1a4;border-bottom:1px solid #916628;font-size:12px}
#paramNotice.show{display:block}
#paramToast{position:fixed;right:18px;bottom:18px;z-index:20;max-width:420px;padding:10px 14px;border-radius:5px;background:#26303b;color:#ecf1f7;border:1px solid #465364;box-shadow:0 8px 26px #0008;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}
#paramToast.show{opacity:1;transform:none}
#paramToast.error{background:#472b30;border-color:#7a3f47}
#paramToast.ok{background:#203b33;border-color:#356554}
#paramFileInput{display:none}
#commandView{background:#11131a;color:#e4e8f0}
#commandShell{display:grid;grid-template-rows:auto 1fr;flex:1;min-width:0;overflow:hidden}
#commandToolbar{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#20242d;border-bottom:1px solid #343a46;flex-wrap:wrap}
#commandToolbar .command-title{font-size:15px;font-weight:700}
#commandToolbar .command-stats{color:#8d99aa;font-size:11px}
#commandToolbar .command-spacer{flex:1}
#commandSearch{width:min(420px,36vw);background:#151820;border:1px solid #3b4350;border-radius:5px;color:#edf1f7;padding:7px 10px}
#commandSearch:focus{outline:none;border-color:#4da3d9}
#commandCategory{background:#151820;border:1px solid #3b4350;border-radius:5px;color:#edf1f7;padding:7px 9px}
#commandToolbar label{display:flex;align-items:center;gap:5px;color:#aeb7c5;font-size:12px}
#commandLayout{display:grid;grid-template-columns:minmax(330px,38%) minmax(420px,1fr);min-height:0;overflow:hidden}
.command-pane{min-width:0;min-height:0;overflow:auto;border-right:1px solid #303642;background:#171a22}
.command-pane:last-child{border-right:none;background:#1c2029}
#commandRows{padding-bottom:24px}
.command-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;width:100%;border:0;border-bottom:1px solid #252a33;border-radius:0;background:#171a22;color:#dce2eb;padding:11px 14px;text-align:left}
.command-row:hover{background:#202630}
.command-row.active{background:#26333e;box-shadow:inset 3px 0 #45a8d8}
.command-row-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650}
.command-row-name{font-family:Consolas,monospace;color:#67c4ef}
.command-row-summary{display:block;margin-top:4px;color:#8e99a9;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.command-badges{display:flex;gap:5px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.command-badge{display:inline-flex;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:700}
.command-badge.read{background:#203d35;color:#7ed9b4}
.command-badge.write{background:#59451d;color:#ffd37a}
.command-badge.motion{background:#542f38;color:#ff9db0}
.command-badge.disabled{background:#343944;color:#929cac}
.command-badge.dev{background:#263c4b;color:#73c7f1}
#commandEmpty{padding:50px 20px;text-align:center;color:#758094}
#commandDetails{padding:22px;max-width:980px}
.command-detail-head{display:flex;align-items:flex-start;gap:12px}
.command-detail-head-main{flex:1;min-width:0}
.command-detail-name{font-family:Consolas,monospace;color:#67c4ef;font-size:25px}
.command-detail-title{font-size:15px;color:#f0f3f8;margin-top:4px}
.command-detail-summary{color:#aeb7c5;line-height:1.65;margin:16px 0}
.command-note{padding:10px 12px;background:#151820;border:1px solid #343c49;border-radius:5px;color:#99a5b5;line-height:1.55;font-size:12px}
.command-note.warn{background:#3d3020;border-color:#765a2b;color:#f3d59c}
.command-form-title{font-size:12px;color:#8793a4;margin:20px 0 8px}
.command-form{display:grid;grid-template-columns:minmax(260px,1fr) minmax(180px,.75fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #2a303a}
.command-form code{font-family:Consolas,monospace;color:#d9edf8;background:#12151c;border:1px solid #303844;border-radius:4px;padding:7px 9px;overflow-wrap:anywhere}
.command-form-desc{color:#9aa5b4;font-size:11px;line-height:1.45}
.command-form-actions{display:flex;gap:5px}
.command-form-actions button{padding:4px 7px;font-size:10px}
@media(max-width:1100px){#paramLayout{grid-template-columns:190px minmax(330px,1fr) 310px}#commandLayout{grid-template-columns:330px minmax(400px,1fr)}}
</style>
</head>
<body>
<header>
<h1>gugaPI Control Center</h1>
<button id="btnConnect" class="primary">Connect</button>
<button id="btnSim">Simulate</button>
<button id="btnRefresh" disabled>Refresh</button>
<span id="statusText"></span>
</header>
<div class="tabbar">
<button class="tab active" id="tabEditor" type="button">序列编辑器</button>
<button class="tab" id="tabTerminal" type="button">串口终端</button>
<button class="tab" id="tabParameters" type="button">参数</button>
<button class="tab" id="tabCommands" type="button">命令库</button>
</div>
<div id="editorView" class="main">
<div class="sidebar"><div style="font-size:12px;opacity:0.5;margin-bottom:6px">SLOTS</div><div id="slotList"></div></div>
<div class="canvas-area" id="canvas"><svg id="flow"></svg></div>
<div class="editor"><h3 style="color:#89b4fa;margin-bottom:10px">Editor</h3><div id="editorContent" style="opacity:0.4">Connect and select a slot</div></div>
</div>
<div id="termView" class="main" hidden>
<div id="termPanel">
<div id="termToolbar">
<span class="term-info">gugaPI UART3 · PA13/RX PA14/TX · 115200 8N1 · Enter 发送 · ↑↓ 历史 · Tab 补全</span>
<button id="btnTermHelp" type="button" disabled>help</button>
<button id="btnTermClear" type="button">清屏</button>
</div>
<div id="termDisplay" role="log" aria-live="polite" aria-label="串口收发内容"></div>
<div id="termInputRow">
<span class="prompt">&gt;</span>
<input id="termInput" type="text" autocomplete="off" spellcheck="false" placeholder="请先连接 gugaPI 串口" disabled>
<button id="btnTermSend" class="primary" type="button" disabled>发送</button>
</div>
</div>
</div>
<div id="paramView" class="main" hidden>
<div id="paramShell">
<div>
<div id="paramToolbar">
<span class="param-title">参数管理</span>
<div class="param-statusbar"><span id="paramStatusDot" class="param-status-dot"></span><span id="paramStatusText">未连接</span></div>
<span class="param-spacer"></span>
<input id="paramSearch" type="search" autocomplete="off" placeholder="搜索名称、原始参数或说明">
<label><input id="paramModifiedOnly" type="checkbox"> 仅看非默认值</label>
<button id="btnParamRefresh" type="button">刷新</button>
<button id="btnParamImport" type="button">导入</button>
<button id="btnParamExport" type="button">导出</button>
<button id="btnParamLoad" type="button">从 FRAM 重载</button>
<button id="btnParamReset" class="warn" type="button">恢复默认</button>
<button id="btnParamSave" class="primary" type="button">保存到 FRAM</button>
<button id="btnParamReboot" type="button">重启设备</button>
<input id="paramFileInput" type="file" accept=".json,application/json">
</div>
<div id="paramNotice"></div>
</div>
<div id="paramLayout">
<aside class="param-pane"><div id="paramGroups"></div></aside>
<section class="param-pane">
<div id="paramListHeader"><span>参数</span><span style="text-align:right;padding-right:12px">当前值</span><span style="text-align:right">状态</span></div>
<div id="paramRows"></div>
<div id="paramEmpty" hidden>没有匹配的参数</div>
</section>
<aside class="param-pane"><div id="paramDetails"><div id="paramEmptyDetail" style="color:#758094;padding:30px 5px">选择一个参数查看详情</div></div></aside>
</div>
</div>
</div>
<div id="commandView" class="main" hidden>
<div id="commandShell">
<div id="commandToolbar">
<span class="command-title">Shell 命令库</span>
<span id="commandStats" class="command-stats"></span>
<span class="command-spacer"></span>
<input id="commandSearch" type="search" autocomplete="off" placeholder="搜索命令、中文说明或参数格式">
<select id="commandCategory" aria-label="命令分类"></select>
<label><input id="commandShowDisabled" type="checkbox"> 显示未启用命令</label>
</div>
<div id="commandLayout">
<section class="command-pane">
<div id="commandRows"></div>
<div id="commandEmpty" hidden>没有匹配的命令</div>
</section>
<aside class="command-pane"><div id="commandDetails"></div></aside>
</div>
</div>
</div>
<div class="log" id="log"></div>
<div id="paramToast" role="status" aria-live="polite"></div>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
<script src="app4.js"></script>
<script src="app5.js?v=20260728-heading-lock"></script>
<script src="command_catalog.js?v=20260728-shell-library"></script>
<script src="app6.js?v=20260728-shell-library"></script>
</body>
</html>
